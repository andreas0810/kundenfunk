name: Public integrations
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: public-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node tools/check-public.mjs
      - name: PHP syntax and WordPress fixtures without network
        run: |
          docker run --rm --network none --mount type=bind,source="$PWD",target=/work,readonly -w /work php:8.3-cli php -l integrations/wordpress/kundenfunk/kundenfunk.php
          docker run --rm --network none --mount type=bind,source="$PWD",target=/work,readonly -w /work php:8.3-cli php test/wordpress.php
  plugin-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: integrations/wordpress/kundenfunk
